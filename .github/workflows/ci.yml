name: Verify Prooflane
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: prooflane_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: prooflane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prooflane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://prooflane_test:ephemeral_ci_only@127.0.0.1:5432/prooflane_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run compile
      - run: npm test
      - run: npm audit --audit-level=high
